# Render Blueprint for ShareSync (FREE plan): API + PostgreSQL + web app.
# Render → New → Blueprint → select this repository. Values marked `sync: false` are entered in
# Render's dashboard when the Blueprint is created; they are never stored in git.
# Full walkthrough: DEPLOYMENT.md
#
# Free-plan notes:
#  - the API sleeps after ~15 min without traffic (first request then takes ~1 min; live sync reconnects)
#  - pre-deploy commands are not available, so migrations run at start (`start:migrate`; idempotent + locked)
#  - free PostgreSQL databases expire after 30 days unless upgraded — upgrade before real users rely on it
#  - the disk is wiped on every restart, so files MUST go to object storage (STORAGE_DRIVER=s3)

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: sharesync-api
    runtime: node
    rootDir: server
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    numInstances: 1              # keep ONE instance: rate limits and real-time rooms are in memory
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Database (internal connection string: private network, no TLS needed)
      - key: DATABASE_URL
        fromDatabase:
          name: sharesync-db
          property: connectionString

      # The web app's address, https only, e.g. https://sharesync-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

      # Firebase Admin service account (Firebase Console → Project settings → Service accounts)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # 32 random bytes, base64 — KEEP AN OFFLINE BACKUP (losing it = losing every file):
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: FILE_ENCRYPTION_KEY
        sync: false

      # Object storage (Cloudflare R2 or Backblaze B2 — see DEPLOYMENT.md)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        sync: false              # R2: auto   |  B2: e.g. us-west-004
      - key: S3_ENDPOINT
        sync: false              # R2: https://<account-id>.r2.cloudflarestorage.com  |  B2: https://s3.<region>.backblazeb2.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Free instances have 512 MB RAM: keep simultaneous uploads low
      - key: UPLOAD_CONCURRENCY
        value: "2"

  # ---------------------------------------------------------------- Web app
  - type: web
    name: sharesync-web
    runtime: static
    rootDir: client
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: dist
    routes:
      # Single-page app: every path (e.g. /s/<token>, /explore) is served by index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      # The API's address, e.g. https://sharesync-api.onrender.com
      - key: EXPO_PUBLIC_API_URL
        sync: false
      # This web app's own address (used in share links), e.g. https://sharesync-web.onrender.com
      - key: EXPO_PUBLIC_WEB_URL
        sync: false
      # Firebase web config (Firebase Console → Project settings → General → Your apps → Web)
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false

databases:
  - name: sharesync-db
    region: singapore
    plan: free
    databaseName: sharesync
    user: sharesync
    postgresMajorVersion: "17"
    ipAllowList: []              # no public access; only Render services in this account can connect

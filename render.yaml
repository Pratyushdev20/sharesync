# Render Blueprint for the ShareSync API + PostgreSQL.
# Render → New → Blueprint → select this repository. Values marked `sync: false` are secrets:
# Render asks for them when the Blueprint is created; they are never stored in git.
# Full walkthrough: DEPLOYMENT.md

services:
  - type: web
    name: sharesync-api
    runtime: node
    rootDir: server
    region: singapore            # closest Render region to India; change if your users are elsewhere
    plan: starter                # paid plan: needed for pre-deploy migrations and no idle spin-down
    branch: main
    autoDeploy: true
    numInstances: 1              # keep ONE instance: rate limits and real-time rooms are in memory
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate   # applies pending migrations before each release (idempotent, locked)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Database (internal connection string: private network, no TLS needed)
      - key: DATABASE_URL
        fromDatabase:
          name: sharesync-db
          property: connectionString

      # Browser origins allowed to call the API, comma-separated https:// URLs
      # e.g. https://app.yourdomain.com
      - key: CORS_ORIGINS
        sync: false

      # Firebase Admin service account (Firebase Console → Project settings → Service accounts)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # 32 random bytes, base64. Generate locally and KEEP AN OFFLINE BACKUP:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Losing it makes every stored file unreadable.
      - key: FILE_ENCRYPTION_KEY
        sync: false

      # Object storage (Render's disk is wiped on every deploy). Cloudflare R2 example:
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false              # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # Memory guard for in-memory uploads (raise on larger instances)
      - key: UPLOAD_CONCURRENCY
        value: "3"

databases:
  - name: sharesync-db
    region: singapore
    plan: basic-256mb            # paid tier: daily backups; free databases expire
    databaseName: sharesync
    user: sharesync
    postgresMajorVersion: "17"
    ipAllowList: []              # no public access; only Render services in this account can connect
